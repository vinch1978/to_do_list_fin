// --- Fonction pour remplir un menu déroulant ---

function remplirSelect(idMenu, liste, champId, champTexte) {

  var menu = document.getElementById(idMenu);

  // Option par défaut
  menu.innerHTML = '<option value="" disabled selected hidden>Faire un choix</option>';

  // On parcourt le tableau JSON
  for (var i = 0; i < liste.length; i++) {
    menu.innerHTML += '<option value="' + liste[i][champId] + '">'
                    + liste[i][champTexte]
                    + '</option>';
  }
}

// --- Remplissage des 4 menus au chargement de la page ---

window.onload = function() {
  remplirSelect("idType", listeType, "idType", "type");

// Définition de la clé et de la liste par défaut
const STORAGE_KEY = 'listeTaches';


// Fonction qui relit ce qui est stocke
function getOrLoadList() {
  const valeurStockee = localStorage.getItem(STORAGE_KEY);// on lit ce qui est stocke
    if (valeurStockee === null) {
        return listeTaches; //si rien est stocke on prend la liste du code
    }

    try {
        let liste = JSON.parse(valeurStockee);//on transforme le texte en tableau js

        if (!Array.isArray(liste)) {
            return listeTaches;//si ce n'est pas un tableau on n'accepte pas et on reprend liste du code
        }

        return liste;
    } catch (e) {
        console.error("Erreur de lecture du localStorage :", e);
        return listeTaches;//si json.parse casse on prend la liste par defaut le (e) represente l'erreur attrape
    }
}

// Utilisation
const maListe = getOrLoadList();

//permet l'ffichage du titre tache en html
function afficherListeTaches(enregistrement) {
    //  Cibler l'element HTML ou afficher la liste
    const container = document.getElementById('tableauTaches');
    
    //  Vider le contenu precedent (optionnel)
    container.innerHTML = '';

    //  Parcourir le tableau de taches et generer le HTML
    enregistrement.forEach(function(tache) {
        if (tache.idStatut == 3) {
     return;
        }// fonction pour ne pas afficher les taches termine mais on les garde ds le local storage
        // recuperation des differents id pour les mettre ds le tableau html
        let searchedtheIdStatut=tache.idStatut;
        let searchedstatut=listeStatut.find(ElementStatut => ElementStatut.idStatut==searchedtheIdStatut).statut;

        let searchedtheIdPriorite=tache.idPriorite;
        let searchedPriorite=listePriorite.find(ElementPriorite => ElementPriorite.idPriorite==searchedtheIdPriorite).priorite;
        let searchedColor=listePriorite.find(ElementColor => ElementColor.idPriorite==searchedtheIdPriorite).color;

        let searchedtheIdDifficulte=tache.idDifficulte;
        let searchedDifficulte=niveauDifficulte.find(ElementNiveauDifficulte => ElementNiveauDifficulte.idDifficulte==searchedtheIdDifficulte).difficulte;
        
        let searchedtheIdType=tache.idType;
        let searchedType=listeType.find(ElementType => ElementType.idType==searchedtheIdType).type;
        
        // Creation du tableau HTML pour chaque tache 
        //  modification du statut avec des boutons 
        // on les deactive "disabled" quand c'est le meme statut
        // data-label pour affiche les titres en responsive
        const htmlTache = `<tr style = "background-color:${searchedColor}"><td data-label="Titre">${tache.titreTache}</td><td data-label="Date création">${tache.dateCreation}</td><td data-label="Date limite">${tache.dateLimite}</td>

            <td data-label="Statut"><button class="statut" type="button" onclick="changeId(${tache.idTache}, 4)" ${tache.idStatut == 4 ? "disabled" : ""}>En attente</button>
            <button class="statut" type="button" onclick="changeId(${tache.idTache}, 1)" ${tache.idStatut == 1 ? "disabled" : ""}>A faire</button>
            <button class="statut" type="button" onclick="changeId(${tache.idTache}, 2)" ${tache.idStatut == 2 ? "disabled" : ""}>En cours</button>
            <button class="statut" type="button" onclick="changeId(${tache.idTache}, 3)" ${tache.idStatut == 3 ? "disabled" : ""}>Terminé</button></td></tr>`;
        
        // Ajout au conteneur
        container.insertAdjacentHTML('beforeend', htmlTache);
    });
}

function changeId(idTache, nouveauStatut){
